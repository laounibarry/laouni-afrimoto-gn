<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Me rejoindre — Laouni AfriMoto</title>
<meta name="description" content="Une position partagée sur Laouni AfriMoto. Commandez une course pour venir la rejoindre."/>
<link rel="icon" href="/favicon.ico"/>

<!--
  ════════════════════════════════════════════════════════════════════════════
  LA PAGE « ME REJOINDRE »

  Quelqu'un partage sa position depuis AfriMoto. Le lien arrive sur WhatsApp,
  et il tombe ICI.

  ══ CE QUE CETTE PAGE FAIT, ET POURQUOI ══

  Partager un lien Google Maps, tout le monde sait le faire — et ça ne mène
  nulle part : on voit un point, puis on doit RETAPER l'adresse dans une
  application. Or beaucoup d'endroits, ici, n'ont pas d'adresse écrite.

  Cette page-ci propose UNE seule chose : commander une course vers ce point.
  Le reste (la carte, le nom du lieu) est là pour rassurer, pas pour occuper.

  Elle sert aussi de porte d'entrée : celui qui n'a pas encore AfriMoto le
  découvre par un proche qui s'en sert. C'est la façon la plus honnête de se
  faire connaître.
  ════════════════════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --orange:#F97316; --orange-fonce:#C2410C; --nuit:#0B1220;
    --texte:#0F172A; --texte2:#64748B; --bord:#E2E8F0; --fond:#F8FAFC;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{
    background:#fff; border-bottom:1px solid var(--bord);
    padding:14px 18px; display:flex; align-items:center; gap:10px;
  }
  .marque{font-weight:900; font-size:15px; letter-spacing:.2px}
  .marque span{color:var(--orange)}
  .sous{font-size:11px; color:var(--texte2)}
  main{flex:1; padding:20px 18px 28px; max-width:560px; margin:0 auto; width:100%}
  h1{font-size:21px; margin:6px 0 4px; font-weight:900}
  .expl{color:var(--texte2); font-size:13.5px; line-height:1.55; margin:0 0 16px}
  .carte{
    background:#fff; border:1px solid var(--bord); border-radius:16px;
    overflow:hidden; margin-bottom:14px;
  }
  #plan{height:250px; width:100%; background:#EAEAEA; display:block; border:0}
  .lieu{padding:14px 16px; display:flex; gap:12px; align-items:flex-start}
  .pastille{
    width:11px;height:11px;border-radius:3px;background:#DC2626;
    margin-top:5px;flex-shrink:0
  }
  .lieu-nom{font-size:14.5px; line-height:1.4; font-weight:600}
  .lieu-coord{font-size:12px; color:var(--texte2); margin-top:3px}
  .bouton{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; padding:16px; border-radius:15px; border:0;
    background:var(--orange); color:#fff; font-size:16px; font-weight:800;
    text-decoration:none; cursor:pointer; margin-bottom:10px;
  }
  .bouton.second{
    background:#fff; color:var(--orange-fonce);
    border:1.5px solid var(--orange); font-size:14px; padding:13px;
  }
  .note{font-size:12px; color:var(--texte2); line-height:1.5; text-align:center; margin-top:14px}
  .erreur{
    background:#FEF2F2; border:1px solid #FECACA; color:#B91C1C;
    padding:14px 16px; border-radius:12px; font-size:13.5px; line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="36" height="36" rx="9" fill="#f97316" opacity=".12"/>
    <path d="M9 10 L18 7 L27 10 L27 21 C27 27 18 31 18 31 C18 31 9 27 9 21 Z" fill="#f97316" opacity=".2"/>
    <path d="M9 10 L18 7 L27 10 L27 21 C27 27 18 31 18 31 C18 31 9 27 9 21 Z" fill="none" stroke="#f97316" stroke-width="1.5"/>
    <polyline points="13,19 17,24 24,15" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>
  <div>
    <div class="marque">LAOUNI <span>AFRIMOTO</span></div>
    <div class="sous">Registre sécurisé · Guinée</div>
  </div>
</header>

<main id="corps">
  <p class="expl">Chargement de la position…</p>
</main>

<script>
(function () {
  'use strict';

  // ── Lire le lien ──────────────────────────────────────────────────────────
  // On accepte NOTRE format (lat/lng/n) et celui de Google Maps (q=lat,lng) :
  // c'est ce dernier que les gens ont déjà l'habitude d'envoyer.
  function lirePosition() {
    var p = new URLSearchParams(location.search);
    var lat = parseFloat(p.get('lat'));
    var lng = parseFloat(p.get('lng'));
    var nom = (p.get('n') || '').trim();

    if (!isFinite(lat) || !isFinite(lng)) {
      var q = p.get('q') || p.get('query') || '';
      var m = /^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/.exec(q);
      if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
    }
    if (!isFinite(lat) || !isFinite(lng)) return null;
    // Un point hors du monde n'est pas un point.
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng, nom: nom };
  }

  function echapper(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var pos = lirePosition();
  var corps = document.getElementById('corps');

  if (!pos) {
    corps.innerHTML =
      '<h1>Position introuvable</h1>' +
      '<div class="erreur">Ce lien ne contient aucune position. ' +
      'Demandez à la personne de le renvoyer depuis l\'application AfriMoto, ' +
      'ou d\'envoyer un lien Google Maps.</div>' +
      '<div style="height:14px"></div>' +
      '<a class="bouton" href="/">Ouvrir Laouni AfriMoto</a>';
    return;
  }

  // La petite carte : une image OpenStreetMap, sans aucune bibliothèque à
  // charger. Sur un forfait guinéen, chaque kilo-octet compte.
  var d = 0.004;
  var cadre = [pos.lng - d, pos.lat - d, pos.lng + d, pos.lat + d].join(',');
  var plan = 'https://www.openstreetmap.org/export/embed.html?bbox=' +
             encodeURIComponent(cadre) + '&layer=mapnik&marker=' +
             pos.lat + ',' + pos.lng;

  var titre = pos.nom ? echapper(pos.nom) : 'Position partagée';
  var coord = pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5);

  // Le lien qui rouvre le site avec la destination déjà posée.
  var versApp = '/?dest_lat=' + pos.lat + '&dest_lng=' + pos.lng +
                (pos.nom ? '&dest_nom=' + encodeURIComponent(pos.nom) : '');

  corps.innerHTML =
    '<h1>📍 Une personne partage sa position</h1>' +
    '<p class="expl">Commandez une course pour venir la rejoindre — ' +
    'la destination est déjà remplie, vous n\'avez rien à retaper.</p>' +

    '<div class="carte">' +
      '<iframe id="plan" src="' + plan + '" loading="lazy" ' +
      'title="Carte de la position partagée"></iframe>' +
      '<div class="lieu">' +
        '<div class="pastille"></div>' +
        '<div>' +
          '<div class="lieu-nom">' + titre + '</div>' +
          '<div class="lieu-coord">' + coord + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<a class="bouton" href="' + versApp + '">🛵 &nbsp;Commander une course ici</a>' +
    '<a class="bouton second" href="https://www.google.com/maps?q=' +
      pos.lat + ',' + pos.lng + '" target="_blank" rel="noopener">' +
      '🗺️ &nbsp;Voir l\'itinéraire sur Google Maps</a>' +

    '<p class="note">Laouni AfriMoto — le registre sécurisé des véhicules à ' +
    'moteur en Guinée. Taxi moto, VTC, voyages entre villes.</p>';
})();
</script>

</body>
</html>
