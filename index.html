<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- ══════════════════════════════════════════════════════════════════════
       LA PAGE D'ENTRÉE DU SITE AFRIMOTO — 01/11/2026

       Le site n'est plus une page écrite à la main : c'est cette
       application. Décision du fondateur : « le site 100% flutter comme
       application, aucune différence ».

       ⚠️ TOUT L'EN-TÊTE CI-DESSOUS EST REPRIS DE L'ANCIEN SITE, mot pour mot.
       Flutter PEINT le texte sur une toile : un moteur de recherche ne lira
       plus une ligne du contenu. Mais cet en-tête-ci, lui, reste du vrai
       HTML — c'est la seule chose qui survit, et elle ne coûte rien. Le
       titre, la description, la fiche Google, les balises de partage
       WhatsApp : si on les perdait aussi, un lien AfriMoto partagé
       n'afficherait plus ni nom ni vignette.

       ⚠️ NE PAS LAISSER FLUTTER REMETTRE SON EN-TÊTE. Ce fichier est le
       gabarit : il est recopié à chaque construction. Celui que Flutter
       fabrique tout seul s'intitule « afrimoto_app » et se décrit comme
       « application Flutter ».
       ══════════════════════════════════════════════════════════════════════ -->
  <base href="/">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#f97316"/>

  <title>Laouni AfriMoto GN — Registre sécurisé de trajets et véhicules à moteur en Guinée</title>
  <meta name="description" content="Laouni AfriMoto GN est le registre de référence des véhicules à moteur en Guinée. Enregistrement moto, taxi, voiture · Anti-vol · Vérification QR · Trajets et taxi-moto."/>
  <meta name="keywords" content="registre moto Guinée, enregistrement véhicule Conakry, anti-vol moto Guinée, vérification moto Guinée, moto volée Guinée, registre taxi Guinée"/>
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"/>
  <meta name="author" content="Laouni AfriMoto GN"/>
  <meta name="copyright" content="Laouni AfriMoto GN 2026"/>
  <meta name="geo.region" content="GN"/>
  <meta name="geo.placename" content="Conakry, Guinée"/>
  <meta name="geo.position" content="9.5370;-13.6773"/>
  <meta name="ICBM" content="9.5370, -13.6773"/>
  <meta name="google-site-verification" content="uFFfubF3U68I8Ycc-usuG3XbID3_4RibN8O1gRLLNx8"/>
  <link rel="canonical" href="https://laouni-securite-ultime.com/"/>

  <!-- Le partage : WhatsApp, Facebook. ⚠️ L'image pointe vers une icône qui
       EXISTE : l'ancienne adresse « /og-image.png » répondait « introuvable »
       depuis toujours, et aucun lien partagé n'avait de vignette. -->
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Laouni AfriMoto GN"/>
  <meta property="og:title" content="Laouni AfriMoto GN — Registre sécurisé de véhicules à moteur en Guinée"/>
  <meta property="og:description" content="Enregistrez votre moto, taxi ou voiture. Vérifiez tout véhicule en Guinée. Déclarez un vol. Publiez des trajets."/>
  <meta property="og:url" content="https://laouni-securite-ultime.com/"/>
  <meta property="og:image" content="https://laouni-securite-ultime.com/icons/icon-512.png"/>
  <meta property="og:image:type" content="image/png"/>
  <meta property="og:locale" content="fr_GN"/>
  <meta property="og:locale:alternate" content="fr_FR"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="Laouni AfriMoto GN — Registre sécurisé de véhicules à moteur en Guinée"/>
  <meta name="twitter:description" content="Enregistrez votre moto, taxi ou voiture. Vérifiez tout véhicule en Guinée. Déclarez un vol."/>
  <meta name="twitter:image" content="https://laouni-securite-ultime.com/icons/icon-512.png"/>

  <!-- Le manifeste et les icônes sont CEUX DU SITE, pas ceux que Flutter
       fabrique : ils portent le nom, les couleurs, et surtout le
       « share_target » qui permet de partager une position vers AfriMoto
       depuis n'importe quelle application Android. -->
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" type="image/png" href="/icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="AfriMoto GN"/>

  <style>
    /* ⚠️ CE QU'ON VOIT PENDANT QUE ÇA CHARGE, ET POURQUOI ÇA COMPTE.

       L'application pèse quelques mégaoctets avant son premier dessin. En
       Guinée, sur une connexion lente, c'est plusieurs secondes d'écran
       BLANC — et un écran blanc, on le quitte. Ces quelques lignes tiennent
       dans la page elle-même : elles paraissent immédiatement, avant le
       moindre octet de l'application.

       Flutter retire ce bloc tout seul dès qu'il a dessiné sa première
       image. */
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }
    #afrimoto-attente {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #FFFFFF; z-index: 2147483647;
      /* L'écran s'efface doucement quand l'application a dessiné : une
         disparition sèche se lit comme un clignotement. */
      transition: opacity .35s ease; opacity: 1;
    }
    #afrimoto-attente.parti { opacity: 0; pointer-events: none; }
    #afrimoto-attente .marque {
      width: 92px; height: 92px; border-radius: 22px; display: block;
      box-shadow: 0 10px 30px rgba(249,115,22,.22);
    }
    #afrimoto-attente .nom {
      margin-top: 20px;
      font-size: 19px; font-weight: 900; color: #111827; letter-spacing: .4px;
    }
    #afrimoto-attente .nom span { color: #f97316; }
    #afrimoto-attente .mot {
      margin-top: 6px; font-size: 12.5px; color: #6B7280; letter-spacing: .2px;
    }
    #afrimoto-attente .barre {
      margin-top: 26px;
      width: 150px; height: 3px; border-radius: 3px; background: #F3F4F6;
      overflow: hidden;
    }
    #afrimoto-attente .barre i {
      display: block; width: 38%; height: 100%; background: #f97316;
      border-radius: 3px; animation: afrimoto-va 1.15s ease-in-out infinite;
    }
    @keyframes afrimoto-va {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(370%); }
    }
    #afrimoto-attente .pied {
      position: absolute; bottom: 26px;
      font-size: 11px; color: #9CA3AF; letter-spacing: .3px;
    }
  </style>
</head>
<body>
  <!-- ⚠️ LE LOGO EST CELUI DE L'APPLICATION, pas celui du vieux site.
       « L'image doit être changée » : l'ancien /icons/icon-192.png est un
       vélo vert qui n'est plus la marque. Celui-ci est le bouclier orange
       d'AfriMoto, le même que sur le téléphone — « aucune différence ». -->
  <div id="afrimoto-attente">
    <img class="marque" src="/assets/assets/logo.png" alt="Laouni AfriMoto GN"
         width="92" height="92" fetchpriority="high"/>
    <div class="nom">LAOUNI <span>AFRIMOTO</span></div>
    <div class="mot">Registre sécurisé des véhicules · Guinée</div>
    <div class="barre"><i></i></div>
    <div class="pied">LAOUNI SARLU · Conakry</div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════════
    //  ⚠️ ENLEVER L'ÉCRAN D'ATTENTE — FLUTTER NE LE FAIT PAS TOUT SEUL
    //
    //  Ce bloc est posé par-dessus tout, au premier plan absolu. Sans les
    //  lignes ci-dessous, il resterait là APRÈS le démarrage : l'application
    //  tournerait derrière, invisible, et personne ne pourrait la toucher.
    //
    //  « flutter-first-frame » est l'évènement que Flutter envoie quand il a
    //  dessiné sa PREMIÈRE image — pas quand il a fini de charger. C'est le
    //  bon moment : l'écran est prêt, on peut s'effacer.
    // ══════════════════════════════════════════════════════════════════════
    (function () {
      var bloc = document.getElementById('afrimoto-attente');
      if (!bloc) return;
      var parti = false;

      function effacer() {
        if (parti) return;
        parti = true;
        bloc.classList.add('parti');
        // On attend la fin du fondu avant de retirer, sinon il disparaît sec.
        setTimeout(function () {
          if (bloc && bloc.parentNode) bloc.parentNode.removeChild(bloc);
        }, 400);
      }

      window.addEventListener('flutter-first-frame', effacer);

      // ⚠️ ET SI LA PREMIÈRE IMAGE N'ARRIVE JAMAIS. C'est exactement ce qui
      //  s'est passé le 01/11 : écran d'attente, et rien d'autre, sans fin.
      //  On ne laisse plus personne devant une barre qui tourne : au bout de
      //  vingt-cinq secondes, on le DIT, et on propose de réessayer.
      setTimeout(function () {
        if (parti) return;
        var mot = bloc.querySelector('.mot');
        var barre = bloc.querySelector('.barre');
        if (barre) barre.style.display = 'none';
        if (mot) {
          mot.innerHTML =
            'Le chargement prend plus de temps que prévu.<br>' +
            'Vérifiez votre connexion, puis réessayez.';
          mot.style.color = '#B45309';
          mot.style.lineHeight = '1.5';
          mot.style.maxWidth = '280px';
          mot.style.textAlign = 'center';
        }
        var bouton = document.createElement('button');
        bouton.textContent = 'Réessayer';
        bouton.style.cssText =
          'margin-top:18px;padding:11px 26px;border:0;border-radius:11px;' +
          'background:#f97316;color:#fff;font-size:14px;font-weight:700;' +
          'font-family:inherit;cursor:pointer';
        bouton.onclick = function () { location.reload(); };
        bloc.appendChild(bouton);
      }, 25000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
